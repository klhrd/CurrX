<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://open.er-api.com https://api.frankfurter.app; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CurrX</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5c6bc0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icons/icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@1.70.0/dist/umd/lucide.js" integrity="sha384-8Cai0b2J4/Woe4s4BadrhqeuGnvD7+EH0e7mRzH3XgtTVY4GGrvp+h2y+TCB/qtO" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="brand">CurrX</div>
            <div class="refresh-status" id="refreshStatus">
                正在讀取快取...<br>---
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="refreshBtn" title="重新整理">
                    <i data-lucide="refresh-cw" size="18"></i>
                </button>
                <button class="icon-btn" id="menuBtn" title="設定">
                    <i data-lucide="settings" size="18"></i>
                </button>
            </div>
        </header>

        <!-- Main Display Content -->
        <main class="main-content">
            <div class="display-block">
                <div class="currency-bar-container">
                    <div class="currency-item" id="fromCurrencyBtn">
                        <span class="currency-name" id="fromCurrency">USD</span>
                        <i data-lucide="chevron-down" size="12"></i>
                    </div>
                    <div class="swap-btn" id="swapBtn">
                        <i data-lucide="repeat" size="16"></i>
                    </div>
                    <div class="currency-item" id="toCurrencyBtn">
                        <span class="currency-name" id="toCurrency">TWD</span>
                        <i data-lucide="chevron-down" size="12"></i>
                    </div>
                </div>
                
                <div class="result-area">
                    <div class="expression" id="expressionDisplay"></div>
                    <div class="results">
                        <div class="res-row secondary">
                            <span class="res-val" id="fromValDisplay">0</span>
                            <span class="res-unit" id="fromUnit">USD</span>
                        </div>
                        <div class="res-row primary">
                            <span class="res-val" id="toValDisplay">0</span>
                            <span class="res-unit" id="toUnit">TWD</span>
                        </div>
                        <div id="multiRows"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Keypad (5-Column) -->
        <div class="keypad">
            <button class="key operator" data-key="(">(</button>
            <button class="key operator" data-key=")">)</button>
            <button class="key operator" data-key="%">%</button>
            <button class="key action span-col-2" data-key="AC">AC</button>
            
            <button class="key operator" data-key="+">+</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key action span-row-2" data-key="BACK"><i data-lucide="delete"></i></button>
            
            <button class="key operator" data-key="-">−</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            
            <button class="key operator" data-key="*">×</button>
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key equal span-row-2" data-key="=">=</button>
            
            <button class="key operator" data-key="/">÷</button>
            <button class="key span-col-2" data-key="0">0</button>
            <button class="key" data-key=".">.</button>
        </div>
    </div>

    <!-- Side Menu -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="side-menu" id="sideMenu">
            <div class="menu-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div style="font-size:1.5rem; font-weight:700;" data-i18n="menuTitle">選單</div>
                <button class="icon-btn" id="closeMenuBtn"><i data-lucide="x"></i></button>
            </div>
            
            <div class="menu-item" id="historyBtn"><i data-lucide="history"></i> <span data-i18n="history">歷史紀錄回溯</span></div>

            <div class="menu-item">
                <i data-lucide="coins"></i> <span data-i18n="multiToggle">多幣別一覽</span>
                <input type="checkbox" id="multiCurrencyCheckbox" style="width: 18px; height: 18px;">
            </div>

            <div class="menu-item">
                <i data-lucide="layout"></i> <span data-i18n="displayMode">顯示語言</span>
                <select id="displayModeSelect">
                    <option value="en" data-i18n="dmEn">僅英文</option>
                    <option value="zh" data-i18n="dmZh">僅中文</option>
                    <option value="both" data-i18n="dmBoth">兩者併列</option>
                </select>
            </div>

            <div class="menu-item" id="shareBtn"><i data-lucide="share-2"></i> <span data-i18n="share">複製與分享</span></div>
            
            <div class="menu-item" id="openSettingsBtn"><i data-lucide="settings"></i> <span data-i18n="settings">設定</span></div>
            
            <div class="menu-footer"><a href="https://github.com/klhrd/CurrX/">CurrX v2.2.0</a></div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="menu-overlay" id="settingsOverlay">
        <div class="side-menu" id="settingsMenu">
            <div class="menu-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div style="font-size:1.5rem; font-weight:700;" data-i18n="settings">設定</div>
                <button class="icon-btn" id="closeSettingsBtn"><i data-lucide="x"></i></button>
            </div>

            <div class="menu-item">
                <i data-lucide="hash"></i> <span data-i18n="precision">小數點位數</span>
                <select id="precisionSelect">
                    <option value="0" data-i18n="p0">0 位</option>
                    <option value="1" data-i18n="p1">1 位</option>
                    <option value="2" data-i18n="p2">2 位</option>
                    <option value="3" data-i18n="p3">3 位</option>
                    <option value="4" data-i18n="p4">4 位</option>
                </select>
            </div>

            <div class="menu-item">
                <i data-lucide="list"></i> <span data-i18n="numFormat">數值格式</span>
                <select id="numFormatSelect">
                    <option value="standard" data-i18n="fmtStandard">標準 (1,234,567)</option>
                    <option value="abbrev" data-i18n="fmtAbbrev">簡寫 (1.2M)</option>
                    <option value="scientific" data-i18n="fmtScientific">科學記號 (1.2E+6)</option>
                </select>
            </div>

            <div class="menu-item">
                <i data-lucide="globe"></i> <span data-i18n="language">介面語言</span>
                <select id="langSelect">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                </select>
            </div>

            <div class="menu-item">
                <i data-lucide="palette"></i> <span data-i18n="theme">色彩主題</span>
                <select id="themeModeSelect">
                    <option value="system" data-i18n="thSystem">跟隨系統</option>
                    <option value="light" data-i18n="thLight">淺色模式</option>
                    <option value="dark" data-i18n="thDark">深色模式</option>
                </select>
            </div>

            <div class="menu-item">
                <i data-lucide="landmark"></i> <span data-i18n="apiSource">匯率來源</span>
                <select id="apiSourceSelect">
                    <option value="fawazahmed">Fawazahmed0</option>
                    <option value="exchangerate">ExchangeRate</option>
                    <option value="frankfurter">Frankfurter</option>
                </select>
            </div>

            <div class="menu-item">
                <i data-lucide="maximize"></i> <span data-i18n="fullscreen">自動全螢幕</span>
                <input type="checkbox" id="fullscreenCheckbox" style="width: 20px; height: 20px;">
            </div>
        </div>
    </div>

    <!-- Picker Modal -->
    <div class="menu-overlay" id="pickerOverlay">
        <div class="side-menu" id="pickerContent">
            <div class="menu-header">
                <div style="font-size:1.2rem; font-weight:700;" data-i18n="pickerTitle">選擇幣別</div>
                <button class="icon-btn" id="closePickerBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="search-container" style="margin-bottom: 15px;">
                <div style="position: relative; display: flex; align-items: center;">
                    <i data-lucide="search" size="16" style="position: absolute; left: 12px; color: var(--text-secondary);"></i>
                    <input type="text" id="currencySearch" placeholder="搜尋代碼、中文或英文..." data-i18n-placeholder="searchPlaceholder" 
                        style="width: 100%; padding: 12px 12px 12px 40px; border-radius: 12px; border: none; background: var(--bg-color); color: var(--text-main); font-family: inherit; outline: none;">
                </div>
                <div class="chip-row" id="chipRow" style="display:none;"></div>
            </div>
            <div class="currency-list" id="currencyList"></div>
        </div>
    </div>

    <!-- History Overlay -->
    <div class="history-overlay" id="historyOverlay">
        <div class="history-content" id="historyContent">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:1.5rem; font-weight:700;" data-i18n="historyTitle">History</div>
                <button class="icon-btn" id="closeHistoryBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="history-list" id="historyList"></div>
            <button class="key operator" id="clearHistoryBtn" style="height:60px; width:100%; border-radius:20px; font-weight:700;" data-i18n="clearHistory">清除所有紀錄</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js" integrity="sha384-2NnkIgIitZUPvVF20yEtYm3encP/kCjZ8nxchj4j7cbqmRi9jaVLYz/Pwn/ZgWQ6" crossorigin="anonymous"></script>
    <script src="assets/js/currencies.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
